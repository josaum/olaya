name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: Build, verify and publish wheel, npm tarball and complete MCPB assets
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.build_release))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: metadata
        run: python scripts/release-plan.py >> "$GITHUB_OUTPUT"

  validation:
    needs: plan
    uses: ./.github/workflows/ci.yml

  packages:
    needs: [plan, validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - name: Build Python wheel and source archive
        run: uv build --out-dir dist/python
      - name: Install package verification dependencies
        run: |
          uv venv --clear
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e '.[dev]'
      - name: Build and pack the Node package
        working-directory: packages/olaya-node
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../../dist/node
          npm pack --pack-destination ../../dist/node
      - name: Verify extracted wheel and npm package
        run: .venv/bin/python scripts/test-release-packages.py > dist/package-verification.json
      - name: Build and verify the source archive independently
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          uv build --wheel "dist/python/olaya-$RELEASE_VERSION.tar.gz" --out-dir "$RUNNER_TEMP/sdist-wheel"
          .venv/bin/python scripts/test-release-packages.py --python-dir "$RUNNER_TEMP/sdist-wheel" --source-archive "dist/python/olaya-$RELEASE_VERSION.tar.gz" > dist/sdist-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ needs.plan.outputs.version }}
          path: |
            dist/python/*
            dist/node/*
            dist/package-verification.json
            dist/sdist-verification.json
          if-no-files-found: error
          retention-days: 14

  desktop:
    needs: [plan, validation]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v5
      - name: Install managed standalone Python and CPU runtime
        run: |
          test "$(uname -m)" = arm64
          uv python install 3.12
          uv venv --clear --python 3.12 --managed-python
          uv pip install -r packaging/desktop-requirements.txt
      - name: Fetch checksum-pinned model inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/fetch-release-model-inputs.py --repo "$GITHUB_REPOSITORY"
      - name: Build complete offline MCPB and skills
        run: .venv/bin/python scripts/build-claude-desktop-complete.py
      - name: Verify extracted runtime offline
        run: .venv/bin/python scripts/test-claude-desktop-complete.py > dist/claude-desktop-complete-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ needs.plan.outputs.version }}
          path: |
            dist/*.mcpb
            dist/*.skill
            dist/*.zip
            dist/claude-desktop-complete-*.json
            dist/claude-desktop-complete-sha256.txt
          if-no-files-found: error
          retention-days: 14

  registries:
    # Registry publication. PyPI uses trusted publishing (OIDC): the `pypi`
    # environment must be registered as a pending/trusted publisher for the
    # `olaya` project on pypi.org. npm uses staged publishing: the tarball is
    # staged with a stage-only granular token (`NPM_TOKEN`, no 2FA bypass) and
    # becomes installable only after a maintainer approves it with 2FA on
    # npmjs.com. Staging may create the package on first use. Once the package
    # exists and has a trusted publisher configured, drop the token and stage
    # through OIDC.
    needs: [plan, packages, desktop]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.plan.outputs.version }}
          path: release-packages
      - name: Publish wheel and source archive to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-packages/python/
          print-hash: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Stage the Node package on npm for 2FA approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm install -g npm@latest   # staged publishing needs npm >= 11.15
          npm --version
          npm stage publish "release-packages/node/olaya-$RELEASE_VERSION.tgz" --access public
          echo "::notice::leio $RELEASE_VERSION is staged on npm; approve it under Staged Packages on npmjs.com (2FA) to make it installable."

  publish:
    needs: [plan, packages, desktop, registries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.plan.outputs.version }}
          merge-multiple: true
          path: release-assets
      - name: Create checksums and honest release notes
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python scripts/prepare-release-assets.py release-assets
      - name: Reserve release tag for the verified commit
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-ref"; then
            git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            tag_status=$?
            test "$tag_status" = 2
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - name: Publish all verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --title "O-Laya $RELEASE_TAG" --notes-file release-assets/RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file release-assets/RELEASE_NOTES.md
