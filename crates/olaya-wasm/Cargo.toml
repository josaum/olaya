[package]
name = "olaya-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of the O-Laya lexical decision engine"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Stripped-down reimplementation of the core router (no Arrow dependency)
# Arrow is not wasm32-compatible due to system library dependencies.

[dev-dependencies]
wasm-bindgen-test = "0.3"

# A [profile.release] here would be ignored (this crate is a workspace member); the size-optimised
# `wasm-release` profile is defined in the workspace root Cargo.toml.

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
