[package]
name = "olaya-core"
version = "0.1.0"
edition = "2021"
description = "Arrow-native zero-copy ontology decision engine in Rust"
license = "MIT"

[dependencies]
arrow = { version = "=58.3.0", features = ["ipc", "ipc_compression", "prettyprint"] }
owl-fast-core = { path = "../owl-fast-core" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = { version = "0.17", features = ["rayon"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"

# Optional ONNX Runtime support
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic", "ndarray"], optional = true }
mycelia-ort-utils = { path = "../mycelia-ort-utils", default-features = false, features = ["load-dynamic"], optional = true }

[features]
default = []
onnx = ["dep:ort", "dep:mycelia-ort-utils"]

[dev-dependencies]
tempfile = "3"
