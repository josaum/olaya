[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leio-decision"
version = "0.5.0"
description = "Ontology-Grounded System 1 Decision Model"
authors = [
    { name = "Dionisio & Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "rdflib>=7.0.0",
]
llm = [
    "anthropic>=0.40",
]
pii = [
    # Standalone olaya[pii] install: PII obfuscation without the full stack.
    "pydantic>=2.0",
]
gemma = [
    # google/embeddinggemma-2 through olaya.embeddings.SentenceTransformerEncoder
    "sentence-transformers[image]>=6.1",
    "transformers>=5.19",
    "peft>=0.21",
]

[project.scripts]
leio-decision = "olaya.webmcp:main"
olaya = "olaya.webmcp:main"
leio = "olaya.webmcp:main"
leio-mcp = "olaya.webmcp:main"
olaya-mcp = "olaya.webmcp:main"  # legacy alias

[tool.hatch.build.targets.wheel]
packages = ["src/olaya"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
