[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leio-decision"
version = "0.7.0"
description = "Ontology-Grounded System 1 Decision Model"
authors = [
    { name = "Dionisio & Team" }
]
readme = "README.md"
requires-python = ">=3.11"
# The base install is pure standard library so a consumer can take one capability
# without the rest. The distribution is leio-decision; the import name stays olaya.
#   leio-decision[pii]        the PII/MNPI obfuscator
#   leio-decision[reasoning]  ontology axioms, calibration arithmetic (numpy, pydantic)
#   leio-decision[ml]         the neural stack: EmbeddingGemma 2 encoder (the default for
#                             OLaya.from_ontology and fine-tuning), the decision head
#                             (torch, transformers, sentence-transformers, peft, onnxruntime);
#                             sentence-transformers[image] pulls torchvision, which must match
#                             the installed torch build (install both from the same index)
#   leio-decision[llm]        the LLM-judge matcher stage (anthropic)
#   leio-decision[rdf]        Turtle / RDF/XML / JSON-LD ontology loading (rdflib)
#   leio-decision[gemma]      deprecated alias of ml (kept so existing installs resolve)
#   leio-decision[all]        reasoning, ml, llm and rdf
dependencies = []

[project.optional-dependencies]
pii = [
    # Standalone olaya[pii] install: PII obfuscation without the full stack.
    "pydantic>=2.0",
]
reasoning = [
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
]
ml = [
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "torch>=2.2.0",
    # google/embeddinggemma-2 through olaya.embeddings.SentenceTransformerEncoder
    "transformers>=5.19",
    "sentence-transformers[image]>=6.1",
    "peft>=0.21",
    "onnxruntime>=1.17.0",
]
llm = [
    "anthropic>=0.40",
]
rdf = [
    # Turtle / RDF/XML / JSON-LD ontologies through olaya.ontology_io.load_ontology
    "rdflib>=7.0.0",
]
all = [
    # Self-reference by the distribution name: the import-name form would resolve
    # to the separate, older `olaya` package on PyPI.
    "leio-decision[reasoning,ml,llm,rdf]",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "rdflib>=7.0.0",
    "leio-decision[all]",
]
gemma = [
    # Deprecated: EmbeddingGemma 2 is part of ml now.
    "leio-decision[ml]",
]

[project.scripts]
leio-decision = "olaya.webmcp:main"
olaya = "olaya.webmcp:main"
leio = "olaya.webmcp:main"
leio-mcp = "olaya.webmcp:main"
olaya-mcp = "olaya.webmcp:main"  # legacy alias

[tool.hatch.build.targets.wheel]
packages = ["src/olaya"]

# Allow-list the source archive: demos, scripts, outputs, benchmarks and the docs site stay in the
# repository and never ship to PyPI (a new top-level directory is excluded until listed here).
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "spec", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
