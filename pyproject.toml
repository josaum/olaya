[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olaya"
version = "0.1.0"
description = "Ontology-Grounded System 1 Decision Model"
authors = [
    { name = "Dionisio & Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olaya"]
