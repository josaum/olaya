[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leio-decision"
version = "0.5.0"
description = "Ontology-Grounded System 1 Decision Model"
authors = [
    { name = "Dionisio & Team" }
]
readme = "README.md"
requires-python = ">=3.11"
# The base install is pure standard library so a consumer can take one
# capability without the rest. The distribution is leio-decision; the import
# name stays olaya. Pick what you need:
#   leio-decision[pii]        the PII/MNPI obfuscator (no third-party dependency
#                             today; the extra exists so the intent is explicit
#                             and future needs land there)
#   leio-decision[reasoning]  ontology axioms, calibration arithmetic (numpy, pydantic)
#   leio-decision[ml]         the trained decision head (torch, transformers, onnxruntime)
#   leio-decision[llm]        the LLM-judge matcher stage (anthropic)
#   leio-decision[gemma]      EmbeddingGemma 2 encoder (sentence-transformers, peft);
#                             opt-in only, not in all: it pulls torchvision, which must
#                             match the installed torch build
#   leio-decision[all]        pii, reasoning, ml and llm
dependencies = []

[project.optional-dependencies]
pii = []
reasoning = [
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
]
ml = [
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "onnxruntime>=1.17.0",
]
llm = [
    "anthropic>=0.40",
]
all = [
    # Self-reference by the distribution name. The old import-name form would
    # resolve to the separate, older `olaya` package on PyPI.
    "leio-decision[reasoning,ml,llm]",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "rdflib>=7.0.0",
    "leio-decision[all]",
]
gemma = [
    # google/embeddinggemma-2 through olaya.embeddings.SentenceTransformerEncoder
    "sentence-transformers[image]>=6.1",
    "transformers>=5.19",
    "peft>=0.21",
]

[project.scripts]
leio-decision = "olaya.webmcp:main"
olaya = "olaya.webmcp:main"
leio = "olaya.webmcp:main"
leio-mcp = "olaya.webmcp:main"
olaya-mcp = "olaya.webmcp:main"  # legacy alias

[tool.hatch.build.targets.wheel]
packages = ["src/olaya"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
